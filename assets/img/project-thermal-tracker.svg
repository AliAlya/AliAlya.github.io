<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="612" viewBox="0 0 1090 612" role="img" aria-labelledby="title desc">
  <title id="title">2-Axis Thermal Satellite Protection Laser System Architecture</title>
  <desc id="desc">Block diagram showing inputs, Nucleo board processing stages, display output, servo and laser output, and manual-mode control path.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5f7fba"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ef3b2d"/>
    </marker>
    <style>
      .title { font: 700 32px Georgia, "Times New Roman", serif; fill: #111; }
      .label { font: 600 16px Georgia, "Times New Roman", serif; fill: #111; }
      .small { font: 500 15px Georgia, "Times New Roman", serif; fill: #111; }
      .red { fill: #ef3b2d; }
      .board { fill: #d9d9d9; stroke: #6f8fcf; stroke-width: 1.2; }
      .bluebox { fill: #dceeff; stroke: #222; stroke-width: 1.5; }
