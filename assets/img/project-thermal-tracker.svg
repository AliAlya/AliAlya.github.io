      .cyan { fill: #e8f5f8; stroke: #222; stroke-width: 1.5; }
      .yellow { fill: #fff6d7; stroke: #222; stroke-width: 1.5; }
      .wire { stroke: #555; stroke-width: 3; fill: none; }
      .bluewire { stroke: #5f7fba; stroke-width: 2; fill: none; marker-end: url(#arrow-blue); }
      .redwire { stroke: #ef3b2d; stroke-width: 3; fill: none; stroke-dasharray: 4 4; marker-end: url(#arrow-red); }
    </style>
  </defs>

